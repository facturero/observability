# OTel Collector (DaemonSet) para facturero — corre SOLO en el cluster del CRM
# (k3s .149), no en el nodo de observabilidad.
#
# Recibe OTLP desde los servicios (http :4318 / grpc :4317),
# enriquece con metadata de Kubernetes (k8sattributes), deriva métricas
# RED de los spans (spanmetrics) y exporta traces + metrics a SigNoz,
# que ahora vive en la máquina dedicada 192.168.100.183 (k3s standalone).
#
# Aplicar (en orden): kubectl apply -f 00-namespaces.yaml ... -f 03-otel-collector.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Métricas del host para la pantalla Infrastructure de SigNoz. Como el
      # colector corre en un contenedor, root_path apunta al hostPath montado
      # en /hostfs; sin eso lee las cifras del contenedor, no las del nodo.
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
          load:
          memory:
          disk:
          network:
          filesystem:
            exclude_fs_types:
              match_type: strict
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs,
                         devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue,
                         nsfs, overlay, proc, procfs, pstore, rpc_pipefs,
                         securityfs, selinuxfs, squashfs, sysfs, tracefs]
            exclude_mount_points:
              match_type: regexp
              mount_points: ["/dev/.*", "/proc/.*", "/sys/.*", "/run/.*",
                             "/var/lib/kubelet/.*", "/var/lib/rancher/.*"]
      # Logs de todos los contenedores del nodo. k3s los escribe como ficheros
      # reales en /var/log/pods con modo 640 root:root, así que el contenedor
      # necesita runAsUser 0 (ver securityContext del DaemonSet) para leerlos.
      filelog:
        include: [/var/log/pods/*/*/*.log]
        # Imprescindible: sin esta exclusión el colector se lee a sí mismo y
        # cada log genera otro log, en bucle infinito.
        exclude: [/var/log/pods/observability_otel-collector-*/*/*.log]
        include_file_path: true
        # Solo lo nuevo. Sin esto reingiere de golpe todo el histórico del nodo.
        start_at: end
        retry_on_failure:
          enabled: true
        operators:
          # Entiende el formato de containerd y saca namespace, pod y contenedor
          # de la ruta, que es lo que k8sattributes usa para enriquecer después.
          - type: container
            add_metadata_from_filepath: true
    processors:
      k8sattributes:
      batch:
      # Sin host.name la pantalla Infrastructure no agrupa nada. El detector
      # env lo lee de OTEL_RESOURCE_ATTRIBUTES, que el DaemonSet rellena con
      # el nombre real del nodo vía downward API (no el del pod).
      resourcedetection:
        detectors: [env, system]
        timeout: 5s
        system:
          hostname_sources: [os]
    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
    exporters:
      otlp/signoz:
        # SigNoz vive en la máquina dedicada: 192.168.100.183 (k3s standalone,
        # collector expuesto como NodePort fijo 30017). De ahí en adelante el
        # tráfico baja por el collector de SigNoz hasta ClickHouse.
        endpoint: 192.168.100.183:30017
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp/signoz, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [batch]
          exporters: [otlp/signoz]
        # Pipeline aparte para que resourcedetection solo toque las métricas
        # del host y no sobreescriba los recursos que ya traen los servicios.
        metrics/host:
          receivers: [hostmetrics]
          processors: [resourcedetection, batch]
          exporters: [otlp/signoz]
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resourcedetection, batch]
          exporters: [otlp/signoz]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.117.0
          args:
            - --config=/conf/otel-collector-config.yaml
          # La imagen corre como UID 10001, que NO puede leer /var/log/pods
          # (modo 640 root:root). Sin esto el receptor filelog falla con
          # permission denied y no entra ni una línea.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: host.name=$(K8S_NODE_NAME)
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              # Subido de 512Mi al añadir filelog: mantiene en memoria el
              # estado de lectura de cada fichero mientras hace el batch.
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        # Raíz del nodo en solo lectura: es lo que lee hostmetrics vía root_path.
        - name: hostfs
          hostPath:
            path: /
        # Logs de contenedores. Se monta aparte de /hostfs para que las rutas
        # dentro del contenedor coincidan con las reales y el operador
        # container pueda deducir namespace, pod y contenedor.
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
