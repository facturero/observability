                <source_file>source_file</source_file>
                <source_line>source_line</source_line>
              </names>
            </formatting>
          </logger>
        </clickhouse>
      config.d/load.xml: |
        <clickhouse>
          <async_load_databases replace="replace">false</async_load_databases>
        </clickhouse>
      config.d/system_log.xml: |
        <clickhouse>
          <text_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
          </text_log>
          <latency_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
          </latency_log>
          <error_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
          </error_log>
          <query_metric_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
          </query_metric_log>
        </clickhouse>

    zookeeper:
      nodes:
        - host: signoz-zookeeper-0.signoz-zookeeper-headless
          port: 2181

  templates:
    podTemplates:
      - name: pod-template
        metadata:
          labels:
            helm.sh/chart: clickhouse-24.1.18
            app.kubernetes.io/name: clickhouse
            app.kubernetes.io/instance: signoz
            app.kubernetes.io/component: clickhouse
            app.kubernetes.io/version: "24.1.2"
            app.kubernetes.io/managed-by: Helm
          annotations:
            signoz.io/path: /metrics
            signoz.io/port: "9363"
            signoz.io/scrape: "true"
        spec:          
          serviceAccountName: signoz-clickhouse
          priorityClassName: ""
          securityContext:
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 101
            runAsUser: 101

          volumes:
            - name: shared-binary-volume
              emptyDir: {}
            - name: custom-functions-volume
              configMap:
                name: signoz-clickhouse-custom-functions
            - name: scripts
              configMap:
                name: signoz-clickhouse-scripts
          initContainers:
            - name: signoz-clickhouse-udf-init
              image: docker.io/alpine:3.18.2
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -e
                  version="v0.0.1"
                  node_os=$(uname -s | tr '[:upper:]' '[:lower:]')
                  node_arch=$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
                  echo "Fetching histogram-binary for ${node_os}/${node_arch}"
                  cd /tmp
                  wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${version}/histogram-quantile_${node_os}_${node_arch}.tar.gz"
                  tar -xzf histogram-quantile.tar.gz
                  chmod +x histogram-quantile
                  mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
                  echo "histogram-quantile installed successfully"
              volumeMounts:
                - name: shared-binary-volume
                  mountPath: /var/lib/clickhouse/user_scripts
          containers:
            - name: clickhouse
              # KEEP CLICKHOUSE-SERVER VERSION IN SYNC WITH
              # https://github.com/SigNoz/signoz/blob/main/deploy/docker/clickhouse-setup/docker-compose.yaml#L5
              image: docker.io/clickhouse/clickhouse-server:25.12.5
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
              ports:
                - name: http
                  containerPort: 8123
                - name: client
                  containerPort: 9000
                - name: interserver
                  containerPort: 9009
              startupProbe:
                httpGet:
                  port: http
                  path: /ping
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                successThreshold: 1
                failureThreshold: 30
              livenessProbe:
                httpGet:
                  port: http
                  path: /ping
                initialDelaySeconds: 60
                periodSeconds: 3
                timeoutSeconds: 1
                successThreshold: 1
                failureThreshold: 10
              readinessProbe:
                httpGet:
                  port: http
                  path: /ping
                initialDelaySeconds: 10
                periodSeconds: 3
                timeoutSeconds: 1
                successThreshold: 1
                failureThreshold: 3

              volumeMounts:
                - name: shared-binary-volume
                  mountPath: /var/lib/clickhouse/user_scripts
                - name: custom-functions-volume
                  mountPath: /etc/clickhouse-server/functions
                - name: scripts
                  mountPath: /scripts
                - name: data-volumeclaim-template
                  mountPath: /var/lib/clickhouse
              resources: 
                requests:
                  cpu: 100m
                  memory: 200Mi

    serviceTemplates:
      - name: service-template
        generateName: signoz-clickhouse
        metadata:
          labels:
            helm.sh/chart: clickhouse-24.1.18
            app.kubernetes.io/name: clickhouse
            app.kubernetes.io/instance: signoz
            app.kubernetes.io/component: clickhouse
            app.kubernetes.io/version: "24.1.2"
            app.kubernetes.io/managed-by: Helm
        spec:
          type: ClusterIP
          ports:
            - name: http
              port: 8123
              nodePort: null
            - name: tcp
              port: 9000
              nodePort: null
    volumeClaimTemplates:
      - name: data-volumeclaim-template
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
