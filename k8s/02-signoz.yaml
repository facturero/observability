spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/component: operator
  template:
    metadata:
      annotations:
        signoz.io/port: "8888"
        signoz.io/scrape: "true"
        checksum/files: c8d653d0277e2f36fadae729f5508e66acfb92307c8990324f56169d68566179
        checksum/confd-files: 94f3e09ff7956c5a88558260c7c4f78b39abaac064f1753a0d7783178237f648
        checksum/configd-files: cf3d35a6112c36b0b929dbd91bd08e819e859f4a83044514f65976416c60d95c
        checksum/templatesd-files: d65e4c1431979c24903978a1679116472d94ea7e063f98fd8b83ef163a00c446
        checksum/usersd-files: 7924fd74a6d6fc630e48a6e867b458ebe2011175b536950821c5ccb05619ece7
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: operator
    spec:      
      serviceAccountName: signoz-clickhouse-operator
      priorityClassName: ""
      securityContext:
        {}
      volumes:
        - name: etc-clickhouse-operator-folder
          configMap:
            name: signoz-clickhouse-operator-etc-files
        - name: etc-clickhouse-operator-confd-folder
          configMap:
            name: signoz-clickhouse-operator-etc-confd-files
        - name: etc-clickhouse-operator-configd-folder
          configMap:
            name: signoz-clickhouse-operator-etc-configd-files
        - name: etc-clickhouse-operator-templatesd-folder
