name: Deploy observability (SigNoz) to observability node

on:
  push:
    branches: [ "master" ]
    paths:
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  deploy-signoz:
    # Runner dedicado del nodo de observabilidad (k3s standalone .183).
    # El runner del cluster del CRM (.149) NO debe desplegar esto: allí ya no
    # vive SigNoz. (03-otel-collector.yaml lo aplica el operador a mano sobre
    # el cluster .149 cuando sea necesario.)
    runs-on: obs

    # El kubectl del runner es el embebido de k3s: sin KUBECONFIG intenta
    # /etc/rancher/k3s/k3s.yaml (raiz-only) y el job muere con exit 1.
    env:
      KUBECONFIG: /home/obs/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply namespaces
        run: |
          kubectl apply -f k8s/00-namespaces.yaml

      - name: Apply SigNoz CRDs (clickhouse-operator)
        run: |
          kubectl apply -f k8s/01-signoz-crds.yaml

      - name: Apply SigNoz stack (clickhouse, query-service, frontend, collector)
        run: |
          kubectl apply -f k8s/02-signoz.yaml

      # 03 (DaemonSet otel-collector) NO se aplica aquí: es el colector
      # intermedio del cluster del CRM, su hogar es el cluster .149.

      - name: Wait for operator, zookeeper, collector and query-service
        run: |
          kubectl rollout status deployment/signoz-clickhouse-operator -n signoz --timeout=180s
          kubectl rollout status statefulset/signoz-zookeeper -n signoz --timeout=180s
          kubectl rollout status deployment/signoz-otel-collector -n signoz --timeout=180s
          kubectl rollout status statefulset/signoz -n signoz --timeout=180s
          kubectl wait --for=condition=Ready pod/chi-signoz-clickhouse-cluster-0-0-0 -n signoz --timeout=300s

      - name: Wait for telemetrystore migration job
        run: |
          kubectl wait --for=condition=complete job/signoz-telemetrystore-migrator -n signoz --timeout=300s